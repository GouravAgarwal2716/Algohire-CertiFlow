services:
  # ─────────────── Infrastructure ───────────────
  postgres:
    image: postgres:16-alpine
    container_name: certiflow-postgres
    environment:
      POSTGRES_USER: certiflow
      POSTGRES_PASSWORD: certiflow_secret
      POSTGRES_DB: certiflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certiflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: certiflow-redis
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─────────────── Mock WhatsApp API ───────────────
  mock-whatsapp:
    build:
      context: ./mock-whatsapp
      dockerfile: Dockerfile
    container_name: certiflow-mock-whatsapp
    environment:
      PORT: 3001
      FAIL_RATE: "0"
      TIMEOUT_RATE: "0"
      TIMEOUT_MS: "2000"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────── Backend API ───────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: certiflow-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://certiflow:certiflow_secret@postgres:5432/certiflow?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: certiflow-jwt-super-secret-2026-prod
      HMAC_SECRET: certiflow-hmac-tamper-proof-secret-2026-prod
      MOCK_WHATSAPP_URL: http://mock-whatsapp:3001
      CERT_STORAGE_PATH: /data/certificates
      PUBLIC_APP_URL: http://localhost:5173
      API_URL: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SLA_TIMEOUT_MS: "60000"
    volumes:
      - cert_storage:/data/certificates
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-whatsapp:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─────────────── Background Worker ───────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: certiflow-worker
    command: ["node", "dist/src/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://certiflow:certiflow_secret@postgres:5432/certiflow?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: certiflow-jwt-super-secret-2026-prod
      HMAC_SECRET: certiflow-hmac-tamper-proof-secret-2026-prod
      MOCK_WHATSAPP_URL: http://mock-whatsapp:3001
      CERT_STORAGE_PATH: /data/certificates
      API_URL: http://localhost:3000
      PUBLIC_APP_URL: http://localhost:5173
      SLA_TIMEOUT_MS: "60000"
    volumes:
      - cert_storage:/data/certificates
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────── Frontend ───────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: certiflow-frontend
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  cert_storage:
